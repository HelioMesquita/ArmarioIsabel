services:
  armario-isabel:
    build:
      context: ..
      dockerfile: project/Dockerfile
    container_name: armario-isabel
    ports:
      - "8080:8080"
    volumes:
      - ../roupinhas:/app/roupinhas
    environment:
      PORT: "8080"
      WARDROBE_DIR: /app/roupinhas
      TZ: America/Sao_Paulo
    restart: unless-stopped
